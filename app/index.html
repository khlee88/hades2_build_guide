<title>하데스2 빌드 길잡이</title>
<style>
/* 하데스2 빌드 길잡이 — 다크 고정, 한 손 조작 (ui/SPEC.md §2) */
:root{
  --bg:#0f1116; --panel:#181b23; --panel-2:#20242f; --line:#2c3140;
  --text:#e8e6df; --dim:#9aa0ad; --accent:#d8b365;
  --good:#6fcf97; --warn:#f2994a; --bad:#eb5757; --info:#56ccf2; --duo:#b58cff;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0}
#app{
  background:var(--bg); color:var(--text); min-height:100vh;
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  overflow-x:hidden; padding-bottom:calc(160px + var(--safe-b));
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
h2{font-size:17px; margin:18px 14px 8px; color:var(--dim); font-weight:600}
.dim{color:var(--dim)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex; align-items:center; gap:8px}
.wrap{padding:0 14px}
.ell{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 상단바 */
.top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 14px; display:flex; align-items:center; gap:10px; min-height:52px}
.top .t{font-weight:700; font-size:17px; flex:1}
.iconbtn{min-width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; font-size:19px; color:var(--dim)}
.iconbtn:active{background:var(--panel-2)}
.banner{background:#3a3210; color:#f0d78a; padding:8px 14px; font-size:13px; border-bottom:1px solid var(--line)}

/* 카드 */
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 14px}
.card.tight{padding:10px}

/* 지금 빌드 */
.bar{height:6px; background:var(--panel-2); border-radius:3px; overflow:hidden; margin-top:6px}
.bar>i{display:block; height:100%; background:var(--accent)}
.slots{display:flex; gap:6px; margin-top:10px}
.slot{flex:1; min-width:0; border-radius:10px; padding:7px 4px; text-align:center;
  background:var(--panel-2); border:1px solid var(--line)}
.slot.empty{border-style:dashed; opacity:.55}
.slot .k{font-size:11px; color:var(--dim)}
.slot .v{font-size:11px; word-break:keep-all; line-height:1.25; margin-top:3px; white-space:normal;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.slot.filled{background:var(--panel); border-color:var(--gc,var(--line))}
.slot.filled .k{color:var(--gc,var(--dim)); font-weight:700}
.slot.core{box-shadow:inset 0 0 0 1px var(--accent)}
.prog{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px}
.prog .bar{flex:1; margin:0}

/* 하단 고정 액션 */
.dock{position:fixed; left:0; right:0; bottom:0; z-index:30; background:linear-gradient(180deg,rgba(15,17,22,0) 0%,var(--bg) 26%);
  padding:14px 14px calc(14px + var(--safe-b)); display:grid; grid-template-columns:1fr 1fr; gap:10px}
.dock button{height:72px; border-radius:14px; background:var(--panel-2); border:1px solid var(--line);
  font-size:16px; font-weight:600; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
.dock button.primary{background:#2a2415; border-color:var(--accent); color:var(--accent)}
.dock button:active{filter:brightness(1.35)}
.dock .ic{font-size:20px}
.cta{position:sticky; bottom:0; padding:12px 14px calc(12px + var(--safe-b)); background:linear-gradient(180deg,rgba(15,17,22,0),var(--bg) 30%)}
.cta button{width:100%; height:56px; border-radius:14px; background:var(--accent); color:#1a1408; font-weight:700; font-size:17px}
.cta button:disabled{background:var(--panel-2); color:var(--dim)}

/* 시트 */
.sheet{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column;
  animation:up .15s ease-out both}
@keyframes up{from{transform:translateY(18px); opacity:.6}to{transform:none; opacity:1}}
.sheet .body{flex:1; overflow-y:auto; overflow-x:hidden; padding-bottom:12px}

/* 칩·격자 */
.chips{display:flex; gap:8px; overflow-x:auto; padding:10px 14px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; min-height:44px; padding:8px 14px; border-radius:22px; background:var(--panel-2);
  border:1px solid var(--line); font-size:15px}
.chip[aria-pressed="true"]{background:var(--panel); border-width:2px; font-weight:700}
.slotchip{display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; flex:0 0 26px;
  border-radius:8px; background:var(--panel-2); border:1px solid var(--line); font-size:13px; font-weight:700}
.slotchip.duo{background:#2b2340; border-color:var(--duo); color:var(--duo)}
.slotchip.leg{background:#33290f; border-color:var(--accent); color:var(--accent)}

.list{padding:0 14px}
.item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; min-height:52px;
  padding:8px 10px; border-bottom:1px solid var(--line); background:none}
.item:active{background:var(--panel-2)}
.item .nm{font-size:15px}
.item .ef{font-size:12px; color:var(--dim); margin-top:1px}
.item .mid{flex:1; min-width:0}
.item[aria-pressed="true"]{background:#20261c; box-shadow:inset 3px 0 0 var(--good)}
.item.off{opacity:.42}
.tagx{font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:1px 5px}
button.tagx{min-height:44px; min-width:44px; padding:0 12px; font-size:13px; border-radius:10px}

/* 신 그리드 */
.gods{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:12px 14px}
.god{min-height:74px; border-radius:14px; background:var(--panel); border:2px solid var(--line);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px}
.god .n{font-size:12px; line-height:1.2; word-break:keep-all; text-align:center}
.god .dot{width:12px; height:12px; border-radius:50%}
.god[aria-pressed="true"]{background:var(--panel-2); box-shadow:0 0 0 2px var(--accent) inset}
.god .seen{font-size:10px; color:var(--good)}

/* 추천 카드 */
.rec{border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 14px; background:var(--panel)}
.rec.r1{background:#1d2130; border-color:var(--accent)}
.rec.no{opacity:.55}
.rec .hd{display:flex; align-items:baseline; gap:8px}
.rec .rk{font-size:12px; font-weight:700; color:var(--accent)}
.rec .sc{margin-left:auto; font-size:12px; color:var(--dim)}
.rec .nm{font-size:18px; font-weight:700; margin-top:4px; display:flex; align-items:center; gap:8px}
.rec.r1 .nm{font-size:22px}
.rec .rs{font-size:14px; color:var(--text); margin-top:5px}
.rec .bg{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.badge{font-size:12px; padding:3px 8px; border-radius:999px; background:var(--panel-2); border:1px solid var(--line)}
.badge.b-마력{color:var(--info); border-color:var(--info)}
.badge.b-생존{color:var(--good); border-color:var(--good)}
.badge.b-융합,.badge.b-융합임박{color:var(--duo); border-color:var(--duo)}
.badge.b-전설{color:var(--accent); border-color:var(--accent)}
.badge.b-항상{color:var(--good); border-color:var(--good)}
.badge.b-전환{color:var(--duo); border-color:var(--duo)}
.warns{margin-top:8px; border-left:3px solid var(--bad); padding:2px 0 2px 9px}
.warns div{font-size:13px; color:#ffb3b3; margin:2px 0}
.rec .act{display:flex; justify-content:flex-end; margin-top:10px}
.rec .act button{height:48px; padding:0 20px; border-radius:12px; background:var(--accent); color:#1a1408; font-weight:700}
.rec:not(.r1) .act button{height:42px; background:var(--panel-2); color:var(--text); border:1px solid var(--line)}

/* 트레이 */
.tray{position:sticky; bottom:0; background:var(--bg); border-top:1px solid var(--line);
  padding:10px 14px calc(10px + var(--safe-b))}
.tray .picks{display:flex; gap:8px; flex-wrap:wrap; min-height:44px; align-items:center}
.pick{display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
  border-radius:10px; padding:6px 8px; font-size:13px}
.pick .rar{border:1px solid var(--line); border-radius:6px; padding:2px 6px; font-size:11px; color:var(--dim)}
.pick .x{color:var(--dim); padding:0 4px; font-size:16px}

/* 무기·양상 선택 */
.wgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 14px}
.wcard{min-height:92px; border-radius:14px; background:var(--panel); border:2px solid var(--line); padding:12px; text-align:left}
.wcard[aria-pressed="true"]{border-color:var(--accent); background:var(--panel-2)}
.wcard .n{font-size:16px; font-weight:700}
.wcard .a{font-size:12px; color:var(--dim); margin-top:3px}
.wcard:disabled{opacity:.38}

/* 관리 */
.seg{display:flex; gap:6px}
.seg button{flex:1; min-height:44px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#1a1408; font-weight:700}
.mrow{display:flex; align-items:center; gap:10px; min-height:56px; padding:10px 14px; border-bottom:1px solid var(--line)}
.mrow .lb{flex:1}
.danger{color:var(--bad); border:1px solid var(--bad); border-radius:12px; padding:12px; width:calc(100% - 28px); margin:14px}
textarea{width:100%; min-height:110px; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:8px; font-size:12px; font-family:ui-monospace,monospace}
input[type=search]{width:100%; height:44px; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:0 12px; font-size:15px}

#toast{position:fixed; left:14px; right:14px; bottom:calc(20px + var(--safe-b)); z-index:60;
  background:#2b3040; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12px;
  font-family:ui-monospace,monospace; color:var(--dim)}
.empty{text-align:center; color:var(--dim); font-size:14px; padding:26px 20px}

</style>
<div id="app"></div>
<div id="toast" hidden></div>

<script>
// engine/recommend.js — 하데스 2 빌드 추천 엔진 (2-B)
// 순수 함수. 난수 없음. 같은 입력 → 같은 출력. 외부 의존 없음.
// 설계 정본: engine/DESIGN.md / 상수: engine/weights.js

function createEngine(data, W) {
  const { boons, duos, hammers, weapons, arcana, keepsakes, hexes, builds, gods } = data;
  const CORE = W.CORE_SLOTS;
  const SLOT_KO = W.SLOT_KO;

  // ── 인덱스 ────────────────────────────────────────────
  const boonById = new Map(boons.map((b) => [b.id, b]));
  const duoById = new Map(duos.map((d) => [d.id, d]));
  const hammerById = new Map(hammers.map((h) => [h.id, h]));
  const weaponById = new Map(weapons.map((w) => [w.id, w]));
  const arcanaById = new Map(arcana.map((a) => [a.id, a]));
  const keepsakeById = new Map(keepsakes.map((k) => [k.id, k]));
  const hexById = new Map(hexes.map((h) => [h.id, h]));
  const godById = new Map(gods.map((g) => [g.id, g]));
  const boonsByGod = new Map();
  for (const b of boons) {
    if (!boonsByGod.has(b.god)) boonsByGod.set(b.god, []);
    boonsByGod.get(b.god).push(b);
  }
  const keepsakeByGod = new Map();
  for (const k of keepsakes) if (k.kind === 'god_favor' && k.god) keepsakeByGod.set(k.god, k);

  const nameOf = (id) =>
    (boonById.get(id) || duoById.get(id) || hammerById.get(id) ||
     arcanaById.get(id) || keepsakeById.get(id) || hexById.get(id) || godById.get(id) || { name_ko: id }).name_ko;
  // 2-C 한글 조사: 마지막 글자에 받침이 있으면 첫째, 없으면 둘째
  const hasFinal = (str) => { const c = (str || '').trim().slice(-1).charCodeAt(0); return c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : true; };
  const josa = (str, a, b) => str + (hasFinal(str) ? a : b);
  const eul = (str) => josa(str, '을', '를');
  const gwa = (str) => josa(str, '과', '와');
  const tier = (t) => W.FLAT.DUO_TIER[t] ?? 0;
  const rankVal = (table, i) => (i < 0 ? null : table[Math.min(i, table.length - 1)]);
  const round = (n) => (Number.isFinite(n) ? Number(n.toFixed(W.SCORE_PRECISION)) : n);

  // ── 상태 파생 ─────────────────────────────────────────
  function derive(state) {
    const owned = new Set([...(state.boons || []), ...(state.hammers || [])]);
    const slotMap = {};
    for (const s of CORE) slotMap[s] = null;
    for (const id of state.boons || []) {
      const b = boonById.get(id);
      if (b && b.occupies_slot) slotMap[b.slot] = id; // 중복은 나중 것이 남는다 (validateState가 경고)
    }
    const seen = (state.gods_seen || []).filter((g) => !W.NON_POOL_GODS.includes(g));
    return {
      owned, slotMap,
      firstGod: (state.gods_seen || [])[0] || null,
      slotBoonCount: CORE.filter((s) => slotMap[s]).length,
      poolSize: new Set(seen).size,
      dirs: (builds.weapons[state.weapon] || { directions: [], first_god_map: {} }),
    };
  }

  // ── 조건 토큰 해석 ────────────────────────────────────
  function tokenMet(tok, ownedSet) {
    if (tok === 'cat:ring') {
      for (const id of ownedSet) { const b = boonById.get(id); if (b && (b.tags || []).includes('ring')) return true; }
      return false;
    }
    if (tok === 'cat:strike') {
      for (const id of ownedSet) { const b = boonById.get(id); if (b && b.slot === 'attack') return true; }
      return false;
    }
    if (tok.startsWith('god:')) {
      const g = tok.slice(4);
      for (const id of ownedSet) { const b = boonById.get(id); if (b && b.god === g) return true; }
      return false;
    }
    return ownedSet.has(tok);
  }
  const groupMet = (grp, ownedSet) => (grp.any || []).some((t) => tokenMet(t, ownedSet));
  const condMet = (cond, ownedSet) => !cond || (cond.all || []).every((g) => groupMet(g, ownedSet));
  const unmetGroups = (duo, ownedSet) => (duo.requires.all || []).filter((g) => !groupMet(g, ownedSet));

  // 융합 목록: 아직 보유하지 않은 것만
  const openDuos = (ownedSet) => duos.filter((d) => d.kind === 'duo' && !ownedSet.has(d.id));
  // 2-C §13-1: 진전/완성/손실은 "도달 가능한" 융합만 — 목표 융합이거나 관련 신이 전부 등장한 것.
  const reachable = (D, targetSet, seenSet) => targetSet.has(D.id) || (D.gods || []).every((g) => seenSet.has(g));

  // ── §2 방향 적합도 F_d ────────────────────────────────
  function directionF(state, dv, d) {
    if (d.requires_hammer && !dv.owned.has(d.requires_hammer)) return -Infinity;
    let F = W.F.BASE;
    for (const [slot, prefs] of Object.entries(d.slot_prefs || {})) {
      const filled = dv.slotMap[slot];
      if (!filled) continue;
      const i = prefs.indexOf(filled);
      if (i < 0) continue;
      const table = (d.core_slots || []).includes(slot) ? W.F.CORE_SLOT_FILLED : W.F.OTHER_SLOT_FILLED;
      F += rankVal(table, i);
    }
    for (const id of d.support_boons || []) if (dv.owned.has(id)) F += W.F.SUPPORT_OWNED;
    for (const id of d.hammers || []) if (dv.owned.has(id)) F += W.F.HAMMER_OWNED;
    if (d.requires_hammer && dv.owned.has(d.requires_hammer)) F += W.F.REQUIRES_HAMMER_OWNED;
    for (const id of d.avoid_boons || []) if (dv.owned.has(id)) F += W.F.AVOID_OWNED;
    if (state.aspect && (d.aspects || []).includes(state.aspect)) F += W.F.ASPECT_MATCH;
    if (dv.firstGod) {
      const order = dv.dirs.first_god_map[dv.firstGod] || [];
      const i = order.indexOf(d.id);
      if (i >= 0) F += rankVal(W.F.FIRST_GOD, i);
    }
    F += W.F.DIFFICULTY_PENALTY * ((d.difficulty || 1) - 1);
    return F;
  }

  // 활성 방향 + 정규화 가중치
  function directionWeights(state) {
    const dv = derive(state);
    const list = (dv.dirs.directions || []).map((d) => ({ d, F: directionF(state, dv, d) }));
    list.sort((a, b) => b.F - a.F || (a.d.id < b.d.id ? -1 : 1));
    const finite = list.filter((x) => Number.isFinite(x.F));

    let active;
    if (state.direction_lock) {
      const locked = list.find((x) => x.d.id === state.direction_lock);
      const backup = finite.find((x) => x.d.id !== state.direction_lock);
      const out = [];
      if (locked) out.push({ ...locked, weight: W.CONVERGE.LOCK_MAIN });
      if (backup) out.push({ ...backup, weight: W.CONVERGE.LOCK_BACKUP });
      return { dv, all: list, active: out };
    }
    let keep = finite.length;
    if (dv.slotBoonCount >= W.CONVERGE.STAGE_C_MIN_SLOTS) keep = W.CONVERGE.STAGE_C_KEEP;
    else if (dv.slotBoonCount >= W.CONVERGE.STAGE_B_MIN_SLOTS) keep = W.CONVERGE.STAGE_B_KEEP;
    active = finite.slice(0, keep);

    const clamped = active.map((x) => Math.max(0, x.F));
    const sum = clamped.reduce((a, b) => a + b, 0);
    const out = active.map((x, i) => ({
      ...x, weight: sum > 0 ? clamped[i] / sum : (active.length ? 1 / active.length : 0),
    }));
    return { dv, all: list, active: out };
  }

  const mainOf = (act) => (act[0] ? act[0].d : null);
  const backupOf = (act) => (act[1] ? act[1].d : null);

  // ── §3-1 선택 불가 판정 ───────────────────────────────
  // 슬롯 유래 상충(= 같은 칸 점유 은혜)은 "교체"이므로 불가가 아니다.
  function blockReason(entity, state, dv, kind) {
    if (dv.owned.has(entity.id)) return '이미 보유';
    for (const cid of entity.conflicts || []) {
      if (!dv.owned.has(cid)) continue;
      const other = boonById.get(cid);
      const slotDerived = kind === 'boon' && entity.occupies_slot && other && other.occupies_slot && other.slot === entity.slot;
      if (!slotDerived) return `상충: ${gwa(nameOf(cid))} 동시 불가`;
    }
    if (kind === 'boon' && entity.prereq && !condMet(entity.prereq, dv.owned)) return '조건 미충족';
    if (kind === 'hammer') {
      if (entity.aspect_only && entity.aspect_only !== state.aspect) return `${nameOf(entity.aspect_only)} 전용`;
      if ((entity.aspect_excluded || []).includes(state.aspect)) return '이 양상에서는 등장하지 않음';
    }
    return null;
  }

  // ── §3-2 base ────────────────────────────────────────
  function baseFit(b, d) {
    const prefs = (d.slot_prefs || {})[b.slot] || [];
    const i = prefs.indexOf(b.id);
    if (i >= 0) return rankVal(W.BOON.SLOT_PREF, i);
    return (d.core_slots || []).includes(b.slot) ? W.BOON.CORE_SLOT_OTHER : W.BOON.NON_CORE_SLOT;
  }

  // 교체로 사라지는 은혜 E가 유일하게 충족하던 미완성 융합들
  function duosBrokenBy(eId, ownedSet, targetSet, seenSet) {
    const without = new Set(ownedSet); without.delete(eId);
    const out = [];
    for (const D of openDuos(ownedSet)) {
      if (!reachable(D, targetSet, seenSet)) continue;
      const before = unmetGroups(D, ownedSet).length;
      const after = unmetGroups(D, without).length;
      if (after > before) out.push(D);
    }
    return out;
  }

  // ── §3 은혜 후보 점수 ─────────────────────────────────
  function scoreBoonEntry(state, cand, ctx) {
    const { dv, active } = ctx;
    const main = mainOf(active), backup = backupOf(active);
    const id = cand.id;
    const duoEnt = duoById.get(id);
    const b = boonById.get(id);
    const entity = b || duoEnt;
    if (!entity) return { id, score: -Infinity, reason: '알 수 없는 id', warnings: [], badges: [], breakdown: {} };

    const warnings = [], badges = [], bd = {};
    const blocked = blockReason(entity, state, dv, b ? 'boon' : 'duo');
    if (blocked) return { id, score: -Infinity, reason: blocked, warnings, badges, breakdown: {} };

    const targetsOf = (d) => new Set((d && d.target_duos) || []);
    const mainT = targetsOf(main), backT = targetsOf(backup);

    // ── 융합/전설 후보 자체
    let flat = 0;
    const rarity = cand.rarity || (b && b.slot === 'legendary' ? 'legendary' : 'common');
    if (duoEnt || rarity === 'duo') {
      const D = duoEnt || null;
      flat += W.FLAT.DUO_CANDIDATE + tier(D ? D.power_tier : '?');
      badges.push('융합');
      bd.duo_candidate = flat;
      const out = { id, score: round(flat), reason: `융합 은혜 — 무조건 최우선 (티어 ${D ? D.power_tier : '?'})`, warnings, badges, breakdown: bd };
      return out;
    }
    if (rarity === 'legendary' || b.slot === 'legendary') {
      flat += W.FLAT.LEGENDARY_CANDIDATE;
      badges.push('전설');
      bd.legendary = W.FLAT.LEGENDARY_CANDIDATE;
    }

    // ── 방향 의존 항
    let dirScore = 0;
    const replacing = b.occupies_slot ? dv.slotMap[b.slot] : null;
    const targetAll = new Set([...mainT, ...backT]);
    const seenPlus = new Set([...(state.gods_seen || []), b.god]); // 지금 보고 있는 신은 등장한 것으로 취급
    const broken = replacing ? duosBrokenBy(replacing, dv.owned, targetAll, seenPlus) : [];
    let dirDetail = null;
    // 2-C §13-5(개정): 이유는 DESIGN §3-4 원문대로 "기여 절댓값이 가장 큰 방향"에서 뽑는다.
    // 중립(neutral)은 역할 있는 방향이 하나도 없을 때만. (역할 우선 규칙은 보험 방향의 회피가
    // 메인 방향의 보조 1순위를 덮어써 1위 후보에 '비추'가 붙는 모순을 만들어 폐기 — S06)
    const consider = (cand) => {
      const contrib = Math.abs((cand.weight || 0) * (cand.fit ?? 0));
      const isNeutral = cand.kind === 'neutral';
      if (!dirDetail) { dirDetail = { ...cand, contrib }; return; }
      const curNeutral = dirDetail.kind === 'neutral';
      if (curNeutral && !isNeutral) { dirDetail = { ...cand, contrib }; return; }
      if (!curNeutral && isNeutral) return;
      if (contrib > dirDetail.contrib || (contrib === dirDetail.contrib && cand.weight > dirDetail.weight)) dirDetail = { ...cand, contrib };
    };
    for (const { d, weight } of active) {
      let fit;
      if (b.occupies_slot) {
        const prefs = (d.slot_prefs || {})[b.slot] || [];
        const myRank = prefs.indexOf(b.id);
        if ((d.avoid_boons || []).includes(b.id)) {
          // 2-C §13-2: 회피는 칸 점유 은혜에도 적용 (파도 일격·화산 일격). 교체 계산보다 우선
          fit = W.BOON.AVOID;
          consider({ d, weight, rank: -1, kind: 'avoid', fit });
        } else {
          fit = baseFit(b, d);
          if (replacing) {
            const E = boonById.get(replacing);
            fit -= baseFit(E, d) + W.BOON.REPLACE_COST;
            for (const D of broken) fit += mainT.has(D.id) || backT.has(D.id) ? W.BOON.DUO_LOSS_TARGET : W.BOON.DUO_LOSS_OTHER;
          }
          consider({ d, weight, rank: myRank, kind: myRank >= 0 ? 'slot' : 'slot_unlisted', fit });
        }
      } else {
        const si = (d.support_boons || []).indexOf(b.id);
        if (si >= 0) { fit = rankVal(W.BOON.SUPPORT, si); consider({ d, weight, rank: si, kind: 'support', fit }); }
        else if ((d.avoid_boons || []).includes(b.id)) { fit = W.BOON.AVOID; consider({ d, weight, rank: -1, kind: 'avoid', fit }); }
        else { fit = W.BOON.NEUTRAL; consider({ d, weight, rank: -1, kind: 'neutral', fit }); }
      }
      dirScore += weight * fit;
    }
    bd.direction = round(dirScore);

    if (replacing) {
      warnings.push(`${eul(nameOf(replacing))} 버리게 됨`);
      // 목표 융합을 앞으로 정렬하고 최대 2건만 이름을 보인다 (폰 화면 가독성)
      const sorted = [...broken].sort((a, b) => (mainT.has(b.id) || backT.has(b.id) ? 1 : 0) - (mainT.has(a.id) || backT.has(a.id) ? 1 : 0));
      const SHOW = 2;
      for (const D of sorted.slice(0, SHOW)) warnings.push(`진행 중 융합 '${D.name_ko}' 무효화`);
      if (sorted.length > SHOW) warnings.push(`그 외 융합 ${sorted.length - SHOW}건도 무효화`);
    }

    // ── §3-3 방향 무관 항
    if ((builds.always_take.boons || []).includes(b.id)) { flat += W.FLAT.ALWAYS_TAKE; badges.push('항상'); bd.always = W.FLAT.ALWAYS_TAKE; }

    const hasSurvival = [...dv.owned].some((x) => { const o = boonById.get(x); return o && (o.tags || []).some((t) => W.SURVIVAL_TAGS.includes(t)); });
    const survivalOn = state.hp_state === 'low' || ((state.region || 1) >= 2 && !hasSurvival);
    if (survivalOn) {
      const pi = (builds.survival_kit.passive || []).indexOf(b.id);
      let sv = 0;
      if (pi >= 0) sv += rankVal(W.FLAT.SURVIVAL_PASSIVE, pi);
      if (b.occupies_slot && ((builds.survival_kit.slot || {})[b.slot] || []).includes(b.id)) sv += W.FLAT.SURVIVAL_SLOT;
      if (sv > 0) { flat += sv; badges.push('생존'); bd.survival = sv; }
    }

    if (main && main.omega_dependent && !dv.slotMap.magick && b.slot === 'magick') {
      const mv = (state.region || 1) >= 2 ? W.FLAT.MAGICK_RULE_REGION2 : W.FLAT.MAGICK_RULE_REGION1;
      flat += mv; badges.push('마력'); bd.magick = mv;
    }

    // 융합 진전 / 완성
    // 교체가 일어나면 사라지는 은혜를 뺀 상태를 기준으로 판정해야 한다 (DESIGN §12)
    const before = new Set(dv.owned);
    if (replacing) before.delete(replacing);
    const after = new Set(before); after.add(b.id);
    let prog = 0, comp = 0; const completed = [];
    for (const D of openDuos(dv.owned)) {
      if (!reachable(D, targetAll, seenPlus)) continue;
      const beforeUnmet = unmetGroups(D, before);
      if (!beforeUnmet.length) continue;
      const afterUnmet = unmetGroups(D, after);
      if (afterUnmet.length === 0) {
        comp += mainT.has(D.id) || backT.has(D.id) ? W.FLAT.DUO_COMPLETE_TARGET : W.FLAT.DUO_COMPLETE_OTHER;
        completed.push(D);
      } else if (afterUnmet.length < beforeUnmet.length) {
        prog += mainT.has(D.id) || backT.has(D.id) ? W.FLAT.DUO_PROGRESS_TARGET : W.FLAT.DUO_PROGRESS_OTHER;
      }
    }
    prog = Math.min(prog, W.FLAT.DUO_PROGRESS_CAP);
    const TIER_ORD = { S: 0, A: 1, B: 2 };
    completed.sort((x, y) => ((targetAll.has(y.id) ? 1 : 0) - (targetAll.has(x.id) ? 1 : 0)) || ((TIER_ORD[x.power_tier] ?? 3) - (TIER_ORD[y.power_tier] ?? 3)));
    if (prog) { flat += prog; bd.duo_progress = prog; }
    if (comp) { flat += comp; badges.push('융합 임박'); bd.duo_complete = comp; }

    const rv = W.FLAT.RARITY[rarity] || 0;
    if (rv) { flat += rv; bd.rarity = rv; }

    if (!W.NON_POOL_GODS.includes(b.god)) {
      // 2-C §13-3: 은혜 단계의 신 풀 항은 가중치 0으로 꺼둠 (값이 0이면 배지도 없음)
      if ((state.gods_seen || []).includes(b.god)) { if (W.FLAT.POOL_SEEN) { flat += W.FLAT.POOL_SEEN; bd.pool = W.FLAT.POOL_SEEN; } }
      else if (dv.poolSize >= W.GOD_POOL_CAP - 1 && W.FLAT.POOL_NEW_PENALTY) { flat += W.FLAT.POOL_NEW_PENALTY; badges.push('새 신'); bd.pool = W.FLAT.POOL_NEW_PENALTY; }
    }
    if ((b.tags || []).includes('beginner_safe')) { flat += W.FLAT.BEGINNER_SAFE; bd.beginner = W.FLAT.BEGINNER_SAFE; }

    const score = dirScore + flat;

    // ── 이유 템플릿 (DESIGN.md §3-4 우선순위)
    let reason;
    const isMain = dirDetail && main && dirDetail.d.id === main.id;
    const roleWord = dv.slotBoonCount === 0 ? '유력' : (isMain ? '메인' : '보험');
    const dirTag = (d) => (main && d.id === main.id) ? '' : ' (보험 방향)';
    if (bd.legendary) reason = '전설 은혜 — 조건을 이미 채웠음, 최우선';
    else if (completed.length) reason = `'${completed[0].name_ko}' 조건 완성 — 다음에 뜰 수 있음`;
    else if (bd.always) reason = '칸 안 차지, 조건 없이 이득';
    else if (dirDetail && dirDetail.kind === 'avoid') reason = `비추: ${String(dirDetail.d.avoid_reason || '').slice(0, 30)}`;
    else if (bd.survival) reason = '체력 관리용 — 지금 방어/회복이 없음';
    else if (bd.magick) reason = 'Ω 빌드인데 마력 칸이 비었음';
    else if (replacing && dirScore <= 0) {
      // 2-C §13-5: 이득 없는 교체는 순위 칭찬처럼 읽히지 않게
      const E = nameOf(replacing);
      reason = dirScore < -1 ? `${E}보다 나을 게 없음` : `${gwa(E)} 비슷한 급 — 바꿀 이유 부족`;
    }
    else if (dirDetail && dirDetail.kind === 'slot')
      reason = `${roleWord} '${dirDetail.d.name_ko}' ${SLOT_KO[b.slot]} ${dirDetail.rank + 1}순위`;
    else if (dirDetail && dirDetail.kind === 'support')
      reason = `'${dirDetail.d.name_ko}' 보조 ${dirDetail.rank + 1}순위${dirTag(dirDetail.d)}`;
    else if (replacing && dirScore > 0) reason = `${nameOf(replacing)}보다 ${dirDetail.d.name_ko}에 더 맞음`;
    else if (b.occupies_slot && !replacing) reason = `빈 ${SLOT_KO[b.slot]} 채움`;
    else reason = '무난함';

    return { id, score: round(score), reason, warnings, badges, breakdown: bd, _dirRank: dirDetail ? dirDetail.rank : -1, _replacing: !!replacing };
  }

  // 동점 처리: 배지 우선순위 → 빈 칸 채우기 → id 사전순
  const BADGE_ORDER = ['융합', '전설', '융합 임박', '생존', '마력'];
  function compareEntries(a, b) {
    if (b.score !== a.score) return b.score - a.score;
    const bp = (x) => { for (let i = 0; i < BADGE_ORDER.length; i++) if (x.badges.includes(BADGE_ORDER[i])) return i; return 99; };
    if (bp(a) !== bp(b)) return bp(a) - bp(b);
    if (!!a._replacing !== !!b._replacing) return a._replacing ? 1 : -1;
    return a.id < b.id ? -1 : 1;
  }
  const ranked = (list) => { list.sort(compareEntries); return list.map((x, i) => ({ ...x, rank: i + 1 })); };

  // ── 공개 API ──────────────────────────────────────────
  function recommendBoons(state, offered) {
    const ctx = directionWeights(state);
    const list = (offered || []).map((o) => scoreBoonEntry(state, typeof o === 'string' ? { id: o } : o, ctx));
    return ranked(list);
  }

  function scoreGodEntry(state, godId, ctx) {
    const { dv, active } = ctx;
    const main = mainOf(active), backup = backupOf(active);
    const badges = [], warnings = [], bd = {};
    const g = godById.get(godId);
    if (!g) return { id: godId, score: -Infinity, reason: '알 수 없는 신', warnings, badges, breakdown: bd };

    if (godId === 'selene') {
      const v = state.hex ? W.GOD.SELENE_HAS_HEX : W.GOD.SELENE_NO_HEX;
      return { id: godId, score: round(v), reason: state.hex ? '비술 강화 (별의 길)' : '비술 확보 — 아직 없음', warnings, badges, breakdown: { fixed: v } };
    }
    if (godId === 'chaos') {
      return { id: godId, score: round(W.GOD.CHAOS), reason: '저주 내용 확인 후 결정', warnings, badges, breakdown: { fixed: W.GOD.CHAOS } };
    }

    const pool = (boonsByGod.get(godId) || []).filter((b) => !blockReason(b, state, dv, 'boon'));
    const scored = pool.map((b) => scoreBoonEntry(state, { id: b.id }, ctx)).filter((x) => Number.isFinite(x.score));
    scored.sort((a, b) => b.score - a.score);
    const topList = scored.slice(0, W.GOD.TOP_N);
    let score = topList.length ? topList.reduce((a, x) => a + x.score, 0) / topList.length : 0;
    bd.top = round(score);

    // 융합 마지막 조건 파트너
    let partner = 0; let partnerDuo = null;
    const targets = [...new Set([...((main && main.target_duos) || []), ...((backup && backup.target_duos) || [])])];
    for (const did of targets) {
      const D = duoById.get(did);
      if (!D || dv.owned.has(did)) continue;
      const unmet = unmetGroups(D, dv.owned);
      if (unmet.length !== 1) continue;
      const canFill = (unmet[0].any || []).some((t) => { const bb = boonById.get(t); return bb && bb.god === godId; });
      if (canFill && partner < W.GOD.DUO_PARTNER_CAP) { partner += W.GOD.DUO_PARTNER; if (!partnerDuo) partnerDuo = D; }
    }
    if (partner) { score += partner; bd.duo_partner = partner; }

    if (!W.NON_POOL_GODS.includes(godId)) {
      if ((state.gods_seen || []).includes(godId)) { score += W.GOD.POOL_SEEN; bd.pool = W.GOD.POOL_SEEN; }
      else if (dv.poolSize >= W.GOD_POOL_CAP - 1) { score += W.GOD.POOL_NEW_PENALTY; badges.push('새 신'); bd.pool = W.GOD.POOL_NEW_PENALTY; }
    }

    let firstInfo = null;
    if (!(state.gods_seen || []).length) {
      const order = dv.dirs.first_god_map[godId] || [];
      if (order.length) {
        // 2-C §13-7: '쉬운 길이 열리는가'가 의도 — 첫 항목만 보면 first_god_map 순서에 의존하므로 아무 방향이나 난이도 1이면 인정
        const opened = order.map((x) => (dv.dirs.directions || []).find((d) => d.id === x)).filter(Boolean);
        let fv = 0;
        if (opened.some((d) => (d.difficulty || 1) === 1)) fv += W.GOD.FIRST_EASY_DIRECTION;
        if (order.length >= 2) fv += W.GOD.FIRST_MULTI_DIRECTION;
        if (fv) { score += fv; bd.first_god = fv; }
        firstInfo = { count: order.length, names: order.map((x) => (dv.dirs.directions.find((d) => d.id === x) || {}).name_ko).filter(Boolean) };
      }
    }
    if (state.keepsake) { const k = keepsakeById.get(state.keepsake); if (k && k.god === godId) { score += W.GOD.KEEPSAKE_MATCH; bd.keepsake = W.GOD.KEEPSAKE_MATCH; } }

    let reason;
    if (partnerDuo) reason = `'${partnerDuo.name_ko}' 마지막 조건을 채울 수 있음`;
    else if (topList.length && main) {
      const t = boonById.get(topList[0].id);
      const prefs = (main.slot_prefs || {})[t && t.slot] || [];
      const i = t ? prefs.indexOf(t.id) : -1;
      if (i === 0) reason = `${dv.slotBoonCount === 0 ? '유력' : '메인'} '${main.name_ko}' ${SLOT_KO[t.slot]} 1순위 '${t.name_ko}' 기대`;
      else if (firstInfo) reason = `첫 신으로 무난 (${firstInfo.count}개 방향 열림: ${firstInfo.names.join(', ')})`;
      else if (bd.pool === W.GOD.POOL_SEEN) reason = '이미 은혜 받은 신 — 풀 집중';
      else reason = t ? `'${t.name_ko}' 등을 기대할 수 있음` : '무난함';
    } else if (firstInfo) reason = `첫 신으로 무난 (${firstInfo.count}개 방향 열림: ${firstInfo.names.join(', ')})`;
    else reason = '무난함';

    return { id: godId, score: round(score), reason, warnings, badges, breakdown: bd, _replacing: false };
  }

  function recommendGods(state, offeredGodIds) {
    const ctx = directionWeights(state);
    return ranked((offeredGodIds || []).map((g) => scoreGodEntry(state, g, ctx)));
  }

  function recommendHammers(state, offeredIds) {
    const ctx = directionWeights(state);
    const { dv, all, active } = ctx;
    const main = mainOf(active);
    const list = (offeredIds || []).map((oid) => {
      const h = hammerById.get(oid);
      const warnings = [], badges = [], bd = {};
      if (!h) return { id: oid, score: -Infinity, reason: '알 수 없는 id', warnings, badges, breakdown: bd };
      const blocked = blockReason(h, state, dv, 'hammer');
      if (blocked) return { id: oid, score: -Infinity, reason: blocked, warnings, badges, breakdown: bd };

      let fitSum = 0, detail = null;
      for (const { d, weight } of active) {
        const i = (d.hammers || []).indexOf(h.id);
        const fit = i >= 0 ? rankVal(W.HAMMER.FIT, i) : W.HAMMER.NOT_LISTED;
        fitSum += weight * fit;
        if (i >= 0 && (!detail || weight > detail.weight)) detail = { d, weight, rank: i };
      }
      bd.direction = round(fitSum);
      let score = fitSum;

      let unlock = null;
      for (const x of all) {
        if (Number.isFinite(x.F)) continue;
        if (x.d.requires_hammer === h.id) { unlock = x.d; break; }
      }
      if (unlock) { score += W.HAMMER.DIRECTION_UNLOCK; badges.push(`방향 전환: ${unlock.name_ko}`); bd.unlock = W.HAMMER.DIRECTION_UNLOCK; }

      const liveSlots = new Set([...(main ? main.core_slots || [] : []), ...CORE.filter((s) => dv.slotMap[s])]);
      if ((h.affects || []).some((a) => liveSlots.has(a) || liveSlots.has(a.replace(/^omega_/, '')))) { score += W.HAMMER.AFFECTS_MATCH; bd.affects = W.HAMMER.AFFECTS_MATCH; }

      const bp = W.HAMMER.BEGINNER_PRIORITY[h.beginner_priority] ?? 0;
      if (bp) { score += bp; bd.beginner = bp; }

      for (const cid of h.conflicts || []) {
        if (dv.owned.has(cid)) continue;
        const other = hammerById.get(cid);
        if (other && other.weapon === h.weapon && main && (main.hammers || []).includes(cid)) {
          score += W.HAMMER.BLOCKS_FUTURE; bd.blocks = (bd.blocks || 0) + W.HAMMER.BLOCKS_FUTURE;
          warnings.push(`${gwa(other.name_ko)} 이후 동시 불가`);
        }
      }

      let reason;
      if (unlock) reason = `'${unlock.name_ko}' 방향을 열어줌`;
      else if (detail) reason = `'${detail.d.name_ko}' 망치 ${detail.rank + 1}순위`;
      else if (bp > 0) reason = h.notes ? String(h.notes).slice(0, 34) : '초보에게 무난';
      else reason = '무난함';
      return { id: oid, score: round(score), reason, warnings, badges, breakdown: bd, _replacing: false };
    });
    return ranked(list);
  }

  // ── §14 아르카나 (4-A 재설계) ─────────────────────────
  // 격자 5×5. 인접 = 8방향. 각성 조건은 arcana[].awaken 구조체로 판정한다.
  const ARC_W = W.ARCANA || { CORE_BASE: 1000, CORE_DECAY: 0.5, PRIORITY: { 1: 6, 2: 3, 3: 1 }, DIRECTION_HIT: 2, DIR_WEIGHTS: [1, 0.6, 0.4], AWAKEN_LOOKAHEAD: 1.5 };
  const arcPos = (c) => (c.grid_position || [0, 0]);
  const arcAdjacent = (c) => {
    const [r, col] = arcPos(c);
    return arcana.filter((o) => { const [r2, c2] = arcPos(o); return o.id !== c.id && Math.abs(r2 - r) <= 1 && Math.abs(c2 - col) <= 1; });
  };
  function awakenMet(c, activeSet) {
    const a = c.awaken; if (!a) return false;
    const act = arcana.filter((o) => activeSet.has(o.id));
    if (a.type === 'adjacent_any') return arcAdjacent(c).some((o) => activeSet.has(o.id));
    if (a.type === 'adjacent_all') return arcAdjacent(c).every((o) => activeSet.has(o.id));
    if (a.type === 'one_each_cost') return (a.costs || []).every((k) => act.some((o) => o.grasp === k));
    if (a.type === 'max_same_cost') { const cnt = {}; for (const o of act) if (o.grasp > 0) cnt[o.grasp] = (cnt[o.grasp] || 0) + 1; return Object.values(cnt).every((n) => n <= a.max) && act.length > 0; }
    if (a.type === 'max_total') return act.length > 0 && act.length <= a.max;
    if (a.type === 'full_other_line') {
      const [r, col] = arcPos(c);
      for (let i = 1; i <= 5; i++) {
        if (i !== r && arcana.filter((o) => arcPos(o)[0] === i).every((o) => activeSet.has(o.id))) return true;
        if (i !== col && arcana.filter((o) => arcPos(o)[1] === i).every((o) => activeSet.has(o.id))) return true;
      }
      return false;
    }
    return false;
  }
  // 활성 집합에서 각성되는 0 이해도 카드를 고정점까지 추가
  function awakenClosure(activeSet) {
    const out = new Set(activeSet); let changed = true;
    while (changed) {
      changed = false;
      for (const c of arcana) if (c.grasp === 0 && !out.has(c.id) && awakenMet(c, out)) { out.add(c.id); changed = true; }
    }
    return out;
  }
  function recommendArcana(weapon, aspect, graspCap) {
    const cap = Math.max(0, graspCap ?? builds.arcana_beginner_set.grasp);
    const state = { weapon, aspect, region: 1, boons: [], hammers: [], gods_seen: [], hp_state: 'mid' };
    const { all } = directionWeights(state);
    const dirs = all.filter((x) => Number.isFinite(x.F)).map((x) => x.d);
    const set = builds.arcana_beginner_set;
    const core = set.cards || [], path = set.upgrade_path || [], never = set.never_with || [];

    // 카드 가치. 핵심 목록은 기하급수(1000, 500, 250…)라 '죽음 1장 > 나머지 전부'가 보장된다.
    // 그 외는 초보 우선순위 + 무기 방향 힌트 + 각성 이웃 보너스.
    const value = (c) => {
      if (c.grasp === 0) return -Infinity;                       // 0 이해도는 각성으로만 켜진다
      const ci = core.indexOf(c.id), pi = path.indexOf(c.id);
      let v;
      if (ci >= 0) v = ARC_W.CORE_BASE * Math.pow(ARC_W.CORE_DECAY, ci);
      else if (pi >= 0) v = ARC_W.CORE_BASE * Math.pow(ARC_W.CORE_DECAY, core.length + pi);
      else { const pr = ARC_W.PRIORITY[c.beginner_priority]; if (pr === undefined) return -Infinity; v = pr; }
      dirs.forEach((d, i) => { if ((d.arcana || []).includes(c.id)) v += ARC_W.DIRECTION_HIT * ARC_W.DIR_WEIGHTS[Math.min(i, ARC_W.DIR_WEIGHTS.length - 1)]; });
      // 이 카드가 '둘러싼 카드 중 하나' 조건의 0 이해도 카드 이웃이면 소폭 가산 (달 등)
      if (arcana.some((z) => z.grasp === 0 && z.awaken && z.awaken.type === 'adjacent_any' && arcAdjacent(z).some((n) => n.id === c.id))) v += ARC_W.AWAKEN_LOOKAHEAD;
      return v;
    };

    // 0/1 배낭: 후보 ≤ 25장, 상한 ≤ 30 → 즉시. 값이 같으면 이해도를 덜 쓰는 쪽.
    function knapsack(cands) {
      const n = cands.length;
      const best = Array.from({ length: n + 1 }, () => new Array(cap + 1).fill(0));
      for (let i = 1; i <= n; i++) {
        const c = cands[i - 1], w = c.grasp, v = c.v;
        for (let g = 0; g <= cap; g++) {
          best[i][g] = best[i - 1][g];
          if (w <= g && best[i - 1][g - w] + v > best[i][g]) best[i][g] = best[i - 1][g - w] + v;
        }
      }
      let g = 0; for (let k = 1; k <= cap; k++) if (best[n][k] > best[n][g]) g = k;
      const out = [];
      for (let i = n; i >= 1; i--) if (best[i][g] !== best[i - 1][g]) { out.push(cands[i - 1]); g -= cands[i - 1].grasp; }
      return out.reverse();
    }
    let cands = arcana.map((c) => ({ ...c, v: value(c) })).filter((c) => Number.isFinite(c.v) && c.grasp > 0 && c.grasp <= cap);
    let chosen = knapsack(cands);
    // never_with: 둘 다 뽑혔으면 가치 낮은 쪽을 제외하고 다시
    for (const pair of never) {
      const inSet = pair.filter((id) => chosen.some((c) => c.id === id));
      if (inSet.length === pair.length) {
        const drop = inSet.map((id) => chosen.find((c) => c.id === id)).sort((a, b) => a.v - b.v)[0].id;
        cands = cands.filter((c) => c.id !== drop); chosen = knapsack(cands);
      }
    }
    // 핵심 순 → 그 외 가치 순으로 정렬해 보여준다
    chosen.sort((a, b) => b.v - a.v);
    const picked = chosen.map((c) => c.id);
    const spent = chosen.reduce((a, c) => a + c.grasp, 0);
    const active = awakenClosure(new Set(picked));
    const awakened = [...active].filter((id) => !picked.includes(id));
    const inDir = (id) => dirs.some((d) => (d.arcana || []).includes(id));
    const tag = (c) => core.includes(c.id) ? '핵심' : path.includes(c.id) ? '핵심' : (inDir(c.id) ? '무기 방향' : '보조');
    const card = (c, t) => ({ id: c.id, name_ko: c.name_ko, grasp: c.grasp, effect: c.effect, tag: t });
    const lockedFree = arcana.filter((c) => c.grasp === 0 && !active.has(c.id))
      .map((c) => ({ id: c.id, name_ko: c.name_ko, effect: c.effect, awaken_condition: c.awaken_condition }));
    const nextUp = cands.filter((c) => !picked.includes(c.id)).sort((a, b) => b.v - a.v).slice(0, 2)
      .map((c) => card(c, '이해도 +' + c.grasp + ' 필요'));
    return {
      grasp_used: spent, grasp_cap: cap, grasp_left: cap - spent,
      cards: chosen.map((c) => card(c, tag(c))),
      awakened: awakened.map((id) => card(arcanaById.get(id), '각성 — 무료')),
      free_cards: lockedFree,
      next_up: nextUp,
    };
  }

  function recommendRunStart(weapon, aspect, opts) {
    const o = opts || {};
    const graspCap = o.graspCap ?? builds.arcana_beginner_set.grasp;
    const owned = o.ownedKeepsakes || null;
    const arc = recommendArcana(weapon, aspect, graspCap);
    const state = { weapon, aspect, region: 1, boons: [], hammers: [], gods_seen: [], hp_state: 'mid' };
    const { all } = directionWeights(state);
    return {
      weapon, aspect,
      arcana: arc,
      keepsakes: (builds.keepsake_plan.region1 || []).filter((k) => !owned || owned.includes(k)).map((id) => { const k = keepsakeById.get(id); return { id, name_ko: k.name_ko, effect: k.effect, giver_ko: k.giver_ko }; }),
      hexes: (builds.hex_beginner || []).map((id) => ({ id, name_ko: nameOf(id), effect: hexById.get(id).effect, mana: hexById.get(id).mana_to_charge, giver_ko: '셀레네' })),
      directions: all.filter((x) => Number.isFinite(x.F)).map((x) => ({
        id: x.d.id, name_ko: x.d.name_ko, difficulty: x.d.difficulty, F: round(x.F), summary: x.d.summary,
        core_slots: (x.d.core_slots || []).map((s) => SLOT_KO[s]),
        first_picks: (x.d.core_slots || []).map((s) => { const p = ((x.d.slot_prefs || {})[s] || [])[0]; return p ? `${SLOT_KO[s]}: ${nameOf(p)}` : null; }).filter(Boolean),
        target_duos: (x.d.target_duos || []).slice(0, 2).map((id) => nameOf(id)),
        key_hammers: (x.d.hammers || []).slice(0, 2).map((id) => nameOf(id)),
      })),
      note: '첫 신이 뜨기 전에는 방향을 고정하지 않습니다.',
    };
  }

  function recommendKeepsake(state) {
    const ctx = directionWeights(state);
    const { dv, active } = ctx;
    const main = mainOf(active);
    if (main) {
      for (const did of main.target_duos || []) {
        const D = duoById.get(did); if (!D || dv.owned.has(did)) continue;
        const unmet = unmetGroups(D, dv.owned);
        if (unmet.length !== 1) continue;
        const godsIn = new Set((unmet[0].any || []).map((t) => (boonById.get(t) || {}).god).filter(Boolean));
        if (godsIn.size === 1) {
          const g = [...godsIn][0], k = keepsakeByGod.get(g);
          if (k) return { id: k.id, name_ko: k.name_ko, reason: `'${D.name_ko}' 마지막 조건 — ${nameOf(g)} 확정 등장` };
        }
      }
      for (const s of main.core_slots || []) {
        if (dv.slotMap[s]) continue;
        const first = ((main.slot_prefs || {})[s] || [])[0];
        const bb = first && boonById.get(first);
        if (bb && !(state.gods_seen || []).includes(bb.god)) {
          const k = keepsakeByGod.get(bb.god);
          if (k) return { id: k.id, name_ko: k.name_ko, reason: `${SLOT_KO[s]} 채울 ${bb.name_ko} 노림` };
        }
      }
    }
    if ((state.region || 1) >= 4) {
      const k = (builds.keepsake_plan.boss_region || [])[0];
      if (k) return { id: k, name_ko: nameOf(k), reason: '보스 지역 — 수호자 대상 효과' };
    }
    if (state.hp_state === 'low') {
      for (const k of ['luckier_tooth', 'ghost_onion']) if (keepsakeById.get(k)) return { id: k, name_ko: nameOf(k), reason: '체력이 낮음 — 생존 우선' };
    }
    return { id: state.keepsake || null, name_ko: state.keepsake ? nameOf(state.keepsake) : null, reason: '현재 유지' };
  }

  function directionScores(state) {
    const { dv, active } = ctx0(state);
    return active.map((x, i) => ({
      id: x.d.id, name_ko: x.d.name_ko, role: i === 0 ? '메인' : i === 1 ? '보험' : '후보',
      weight: round(x.weight), F: round(x.F), difficulty: x.d.difficulty, summary: x.d.summary,
      filled: CORE.map((s) => ({ slot: s, slot_ko: SLOT_KO[s], core: (x.d.core_slots || []).includes(s), boon: dv.slotMap[s] ? nameOf(dv.slotMap[s]) : null })),
      next_wants: (x.d.core_slots || []).filter((s) => !dv.slotMap[s]).flatMap((s) => ((x.d.slot_prefs || {})[s] || []).slice(0, 3).map((id) => ({ slot_ko: SLOT_KO[s], id, name_ko: nameOf(id) }))),
      duo_progress: (x.d.target_duos || []).map((did) => { const D = duoById.get(did); if (!D) return null; const total = (D.requires.all || []).length; return { id: did, name_ko: D.name_ko, tier: D.power_tier, satisfied: total - unmetGroups(D, dv.owned).length, total, owned: dv.owned.has(did) }; }).filter(Boolean),
    }));
  }
  const ctx0 = (state) => directionWeights(state);

  function applyChoice(state, choice) {
    const next = JSON.parse(JSON.stringify(state));
    next.boons = next.boons || []; next.hammers = next.hammers || []; next.gods_seen = next.gods_seen || [];
    if (choice.kind === 'boon') {
      const b = boonById.get(choice.id) || duoById.get(choice.id);
      if (b && b.occupies_slot) next.boons = next.boons.filter((id) => { const o = boonById.get(id); return !(o && o.occupies_slot && o.slot === b.slot); });
      if (!next.boons.includes(choice.id)) next.boons.push(choice.id);
      const god = (boonById.get(choice.id) || {}).god;
      if (god && !next.gods_seen.includes(god)) next.gods_seen.push(god);
      for (const g of (duoById.get(choice.id) || {}).gods || []) if (!next.gods_seen.includes(g)) next.gods_seen.push(g);
    } else if (choice.kind === 'hammer') {
      if (!next.hammers.includes(choice.id)) next.hammers.push(choice.id);
    } else if (choice.kind === 'god') {
      if (!next.gods_seen.includes(choice.id)) next.gods_seen.push(choice.id);
    } else if (choice.kind === 'keepsake') next.keepsake = choice.id;
    else if (choice.kind === 'hex') next.hex = choice.id;
    return next;
  }

  function validateState(state) {
    const out = [];
    const seenSlot = {};
    for (const id of state.boons || []) {
      const b = boonById.get(id);
      if (!b) { out.push(`알 수 없는 은혜 id: ${id}`); continue; }
      if (!b.occupies_slot) continue;
      if (seenSlot[b.slot]) out.push(`${SLOT_KO[b.slot]} 칸에 은혜가 2개: ${nameOf(seenSlot[b.slot])} / ${b.name_ko}`);
      else seenSlot[b.slot] = id;
    }
    for (const id of state.hammers || []) {
      const h = hammerById.get(id);
      if (!h) { out.push(`알 수 없는 망치 id: ${id}`); continue; }
      if (h.weapon !== state.weapon) out.push(`다른 무기의 망치: ${h.name_ko}`);
    }
    if (state.weapon && !weaponById.has(state.weapon)) out.push(`알 수 없는 무기: ${state.weapon}`);
    if (state.aspect && !(weaponById.get(state.weapon) || { aspects: [] }).aspects.some((a) => a.id === state.aspect)) out.push(`무기와 맞지 않는 양상: ${state.aspect}`);
    return out;
  }

  return { recommendRunStart, recommendArcana, recommendGods, recommendBoons, recommendHammers, recommendKeepsake, directionScores, applyChoice, validateState, _internal: { directionWeights, derive } };
}

if (typeof module !== 'undefined' && module.exports) module.exports = { createEngine };
if (typeof window !== 'undefined') window.createHadesEngine = createEngine;

<script>
/* 하데스2 빌드 길잡이 — UI (ui/SPEC.md 3-A 구현)
   엔진은 window.createHadesEngine / window.HADES_WEIGHTS 를 그대로 쓴다. 수정하지 않는다. */
(function () {
  'use strict';
  var DATA = JSON.parse(document.getElementById('h2-data').textContent);

  var E = window.createHadesEngine(DATA, W);

  // ── 인덱스 ─────────────────────────────────────────────
  var IX = {};

    IX[k] = {}; DATA[k].forEach(function (o) { IX[k][o.id] = o; });
  });
  var ASP = {};
  DATA.weapons.forEach(function (w) { (w.aspects || []).forEach(function (a) { ASP[a.id] = a; }); });
  var ent = function (id) { return IX.boons[id] || IX.duos[id] || IX.hammers[id] || IX.keepsakes[id] || IX.hexes[id] || IX.arcana[id] || IX.gods[id] || ASP[id] || null; };
  var nm = function (id) { var o = ent(id); return o ? o.name_ko : id; };

  var SLOTS = ['attack', 'special', 'cast', 'sprint', 'magick'];
  var SK = { attack: '공', special: '기', cast: '마', sprint: '질', magick: '력' };
  var SKO = W.SLOT_KO;
  var GC = { zeus: '#f2d16b', hestia: '#ff8a3d', poseidon: '#4aa3ff', demeter: '#7ed491', apollo: '#ffd166', aphrodite: '#ff7eb6', hephaestus: '#c97b4a', hera: '#b58cff', ares: '#e05252', hermes: '#c0c7d1', artemis: '#5fbf8a', selene: '#a9c4ff', chaos: '#c76bd9' };
  var GOD_ORDER = ['zeus', 'hestia', 'poseidon', 'demeter', 'apollo', 'aphrodite', 'hephaestus', 'hera', 'ares', 'hermes', 'artemis', 'selene', 'chaos'];
  var RAR = ['common', 'rare', 'epic', 'heroic'];
  var RAR_KO = { common: '일반', rare: '희귀', epic: '특별', heroic: '영웅' };

  // ── 저장 ───────────────────────────────────────────────
  var saveFail = false;
  function ls(k, v) {
    try {
      if (v === undefined) { var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }
      localStorage.setItem(k, JSON.stringify(v)); return true;
    } catch (e) { saveFail = true; return v === undefined ? null : false; }
  }
  var PREFS = ls('h2.prefs.v1') || { owned_keepsakes: [], grasp_cap: 10, left_hand: false, show_score: true, last_weapon: 'staff', last_aspect: 'staff_melinoe' };
  var UI = ls('h2.ui.v1') || { screen: null, god_tab: null };
  var RUN = ls('h2.run.v1');
  var savePrefs = function () { ls('h2.prefs.v1', PREFS); };
  var saveUI = function () { ls('h2.ui.v1', UI); };
  var saveRun = function () { ls('h2.run.v1', RUN); };

  function newRun(weapon, aspect) {
    return { state: { weapon: weapon, aspect: aspect, region: 1, boons: [], hammers: [], arcana: [], keepsake: null, hex: null, gods_seen: [], hp_state: 'mid', direction_lock: null }, pending_god: null, history: [] };
  }
  function pushHistory(label) {
    RUN.history.unshift({ ts: Date.now(), label: label, snap: JSON.stringify(RUN.state) });
    if (RUN.history.length > 10) RUN.history.length = 10;
  }
  function undo() {
    if (!RUN.history.length) return toast('되돌릴 기록이 없습니다');
    RUN.state = JSON.parse(RUN.history.shift().snap); saveRun(); render();
  }

  // ── 유틸 ───────────────────────────────────────────────
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var toastT;
  function toast(msg) {
    var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function slotChip(o) {

  }
  function badgeHtml(b) {

  }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

  // ── 화면 전환 ──────────────────────────────────────────
  var sheet = null;

  window.addEventListener('popstate', function () { if (UI.screen) { UI.screen = null; saveUI(); render(); } });

  // ── 렌더 ───────────────────────────────────────────────
  var app = document.getElementById('app');
  function render() {

    else if (UI.screen === 'boons') app.appendChild(viewPick('boon'));

  }
  function wrapSheet(title, inner) {
    var s = el('<div class="sheet"><div class="top"><button class="iconbtn" data-close>✕</button><div class="t">' + esc(title) + '</div></div><div class="body"></div></div>');

    s.querySelector('.body').appendChild(inner);

  }

  // ── 1. 런 시작 ─────────────────────────────────────────
  var startSel = { weapon: PREFS.last_weapon, aspect: PREFS.last_aspect };
  function viewStart(asSheet) {
    var root = document.createElement('div');
    if (!asSheet) root.appendChild(el('<div class="top"><div class="t">하데스2 빌드 길잡이</div></div>'));
    if (saveFail) root.appendChild(el('<div class="banner">저장이 안 됩니다 — 이 탭을 닫으면 사라져요</div>'));

    root.appendChild(el('<h2>무기</h2>'));
    var wg = el('<div class="wgrid"></div>');

      var ready = w.unlock_order <= 4;
      var b = el('<button class="wcard" ' + (ready ? '' : 'disabled') + ' aria-pressed="' + (startSel.weapon === w.id) + '">' +
        '<div class="n">' + esc(w.name_ko) + '</div><div class="a">' + esc(ready ? (w.alias_ko || '') : '준비 중') + '</div></button>');
      if (ready) b.onclick = function () { startSel.weapon = w.id; startSel.aspect = w.aspects[0].id; rerenderStart(root, asSheet); };
      wg.appendChild(b);
    });
    root.appendChild(wg);

    var wp = IX.weapons[startSel.weapon];
    root.appendChild(el('<h2>양상</h2>'));

    wp.aspects.forEach(function (a) {
      var locked = !!a.hidden;
      var b = el('<button class="chip" aria-pressed="' + (startSel.aspect === a.id) + '">' + esc(a.name_ko) + (locked ? ' 🔒' : '') + '</button>');
      b.onclick = locked ? function () { toast('숨겨진 양상 — 해금 후 사용'); } : function () { startSel.aspect = a.id; rerenderStart(root, asSheet); };
      ch.appendChild(b);
    });
    root.appendChild(ch);
    root.appendChild(el('<div class="wrap sm dim">' + esc(wp.beginner_note || '') + '</div>'));

    var r = E.recommendRunStart(startSel.weapon, startSel.aspect, { graspCap: PREFS.grasp_cap, ownedKeepsakes: PREFS.owned_keepsakes.length ? PREFS.owned_keepsakes : null });

    root.appendChild(el('<h2>아르카나 (이해도 ' + r.arcana.grasp_used + '/' + r.arcana.grasp_cap + ')</h2>'));
    var ac = el('<div class="card tight"></div>');
    r.arcana.cards.forEach(function (c) {
      ac.appendChild(el('<div class="row" style="padding:6px 0"><span class="slotchip">' + c.grasp + '</span><div class="mid" style="flex:1;min-width:0"><div class="ell">' + esc(c.name_ko) + '</div><div class="xs dim ell">' + esc(c.effect) + '</div></div></div>'));
    });
    root.appendChild(ac);
    if (r.arcana.free_cards.length) {
      var det = el('<details class="card tight"><summary class="sm dim">각성 조건 충족 시 무료 (' + r.arcana.free_cards.length + '장)</summary></details>');
      r.arcana.free_cards.forEach(function (c) {
        det.appendChild(el('<div style="padding:6px 0"><div class="sm">' + esc(c.name_ko) + '</div><div class="xs dim">' + esc(c.awaken_condition || '') + '</div></div>'));
      });
      root.appendChild(det);
    }

    root.appendChild(el('<h2>기념품 · 비술</h2>'));
    var kc = el('<div class="card tight"></div>');
    r.keepsakes.slice(0, 3).forEach(function (k) { kc.appendChild(el('<div style="padding:5px 0"><div class="sm">' + esc(k.name_ko) + '</div><div class="xs dim ell">' + esc(k.effect) + '</div></div>')); });
    r.hexes.slice(0, 2).forEach(function (h) { kc.appendChild(el('<div style="padding:5px 0"><div class="sm">' + esc(h.name_ko) + ' <span class="xs dim">마력 ' + h.mana + '</span></div><div class="xs dim ell">' + esc(h.effect) + '</div></div>')); });
    root.appendChild(kc);

    root.appendChild(el('<h2>열린 빌드 방향</h2>'));
    root.appendChild(el('<div class="wrap sm dim">' + esc(r.note) + '</div>'));
    r.directions.forEach(function (d) {
      root.appendChild(el('<div class="card"><div class="row"><b>' + esc(d.name_ko) + '</b><span class="xs dim">★' + d.difficulty + '</span></div>' +
        '<div class="sm dim" style="margin-top:4px">' + esc(d.summary) + '</div>' +
        '<div class="xs dim" style="margin-top:6px">핵심 칸: ' + esc(d.core_slots.join(' · ')) + '</div>' +
        '<div class="xs dim">' + esc(d.first_picks.join(' / ')) + '</div>' +
        (d.target_duos.length ? '<div class="xs dim">노리는 융합: ' + esc(d.target_duos.join(', ')) + '</div>' : '') +
        (d.key_hammers.length ? '<div class="xs dim">망치: ' + esc(d.key_hammers.join(', ')) + '</div>' : '') + '</div>'));

      PREFS.last_weapon = startSel.weapon; PREFS.last_aspect = startSel.aspect; savePrefs();
      RUN = newRun(startSel.weapon, startSel.aspect); saveRun(); UI.screen = null; saveUI(); render();
    };
    root.appendChild(cta);
    return root;
  }
  function rerenderStart(root, asSheet) {
    var fresh = viewStart(asSheet); root.replaceWith(fresh);
    if (!asSheet) { app.innerHTML = ''; app.appendChild(fresh); }
  }

  // ── 2. 홈 ──────────────────────────────────────────────
  function viewHome() {
    var st = RUN.state;
    var root = document.createElement('div');
    var wp = IX.weapons[st.weapon];
    var top = el('<div class="top"><div class="t">' + esc(wp.name_ko) + '</div>' +
      '<button class="iconbtn" data-undo title="되돌리기">↶</button></div>');
    top.querySelector('[data-undo]').onclick = undo;
    root.appendChild(top);
    if (saveFail) root.appendChild(el('<div class="banner">저장이 안 됩니다 — 이 탭을 닫으면 사라져요</div>'));

    var warn = E.validateState(st);
    if (warn.length) root.appendChild(el('<div class="banner">' + esc(warn.join(' · ')) + '</div>'));

    var ds = E.directionScores(st);
    var card = el('<div class="card"></div>');
    var hp = { high: '●●●', mid: '●●○', low: '●○○' }[st.hp_state];
    var meta = el('<div class="row sm dim"><span>' + esc((IX.weapons[st.weapon].aspects.find(function (a) { return a.id === st.aspect; }) || {}).name_ko || '') + '</span>' +
      '<button class="tagx" data-region>' + st.region + '지역</button><button class="tagx" data-hp>' + hp + '</button>' +
      (st.direction_lock ? '<span class="tagx">🔒 고정</span>' : '') + '</div>');
    meta.querySelector('[data-region]').onclick = function () { openSheet('manage'); };
    meta.querySelector('[data-hp]').onclick = function () { cycleHp(); };
    card.appendChild(meta);

    if (ds.length) {
      var m = ds[0];
      card.appendChild(el('<div style="margin-top:8px"><div class="row"><b>' + esc(m.name_ko) + '</b>' +
        '<span class="xs dim">' + Math.round(m.weight * 100) + '%</span>' +
        (ds[1] ? '<span class="xs dim" style="margin-left:auto">보험 ' + esc(ds[1].name_ko) + '</span>' : '') + '</div>' +
        '<div class="bar"><i style="width:' + Math.round(m.weight * 100) + '%"></i></div></div>'));
    } else card.appendChild(el('<div class="sm dim" style="margin-top:8px">아직 방향 정보가 없습니다</div>'));

    var smap = {};
    st.boons.forEach(function (id) { var b = IX.boons[id]; if (b && b.occupies_slot) smap[b.slot] = b; });
    var sl = el('<div class="slots"></div>');
    var core = ds.length ? (ds[0].filled || []) : [];
    SLOTS.forEach(function (s) {
      var b = smap[s], f = core.find(function (x) { return x.slot === s; });
      var cls = 'slot ' + (b ? 'filled' : 'empty') + (f && f.core ? ' core' : '');
      var style = b ? ' style="--gc:' + GC[b.god] + '"' : '';
      sl.appendChild(el('<div class="' + cls + '"' + style + '><div class="k">' + SK[s] + '</div>' +
        '<div class="v">' + esc(b ? b.name_ko : '빈 칸') + '</div></div>'));
    });
    card.appendChild(sl);

    if (ds.length) {
      var det = el('<details style="margin-top:8px"><summary class="sm dim">다음에 원하는 것 · 융합 진행도</summary></details>');
      var nw = ds[0].next_wants.slice(0, 3).map(function (x) { return x.slot_ko + ' ' + x.name_ko; }).join(' · ');
      det.appendChild(el('<div class="sm" style="margin-top:6px">' + esc(nw || '핵심 칸이 다 찼습니다') + '</div>'));
      ds[0].duo_progress.slice(0, 3).forEach(function (d) {
        det.appendChild(el('<div class="prog"><span class="xs" style="width:96px" class="ell">' + esc(d.name_ko) + '</span>' +
          '<div class="bar"><i style="width:' + Math.round(d.satisfied / d.total * 100) + '%"></i></div>' +
          '<span class="xs dim">' + d.satisfied + '/' + d.total + '</span></div>'));
      });
      card.appendChild(det);
    }
    root.appendChild(card);

    var owned = st.boons.length + st.hammers.length;
    root.appendChild(el('<div class="wrap xs dim">보유 은혜 ' + st.boons.length + ' · 망치 ' + st.hammers.length + ' · 만난 신 ' + st.gods_seen.length + '</div>'));

    var A = ['gods', '신 선택', '⚱'], B = ['boons', '은혜 선택', '✦'], C = ['hammers', '망치 선택', '🔨'], D = ['manage', '관리', '⚙'];
    var order = PREFS.left_hand ? [B, A, D, C] : [A, B, C, D];
    var dock = el('<div class="dock"></div>');
    order.forEach(function (o) {
      var b = el('<button class="' + (o[0] === 'boons' ? 'primary' : '') + '"><span class="ic">' + o[2] + '</span>' + o[1] + '</button>');
      b.onclick = function () { openSheet(o[0]); };
      dock.appendChild(b);
    });
    root.appendChild(dock);
    return root;
  }
  function cycleHp() {
    var o = ['high', 'mid', 'low'], i = o.indexOf(RUN.state.hp_state);
    RUN.state.hp_state = o[(i + 1) % 3]; saveRun(); render();
  }

  // ── 3. 신 선택 ─────────────────────────────────────────
  var godSel = [];
  function viewGods() {
    var body = document.createElement('div');
    body.appendChild(el('<div class="wrap sm dim" style="padding-top:10px">문 위에 뜬 신을 2개 이상 골라 주세요</div>'));
    var grid = el('<div class="gods"></div>');
    var out = el('<div></div>');
    var btns = {};
    GOD_ORDER.forEach(function (id) {
      var seen = RUN.state.gods_seen.indexOf(id) >= 0;
      var b = el('<button class="god" aria-pressed="false" style="border-color:' + GC[id] + '">' +
        '<span class="dot" style="background:' + GC[id] + '"></span><span class="n">' + esc(nm(id)) + '</span>' +
        (seen ? '<span class="seen">✓ 받음</span>' : '') + '</button>');
      b.onclick = function () {
        var i = godSel.indexOf(id);
        if (i >= 0) godSel.splice(i, 1); else godSel.push(id);
        refresh();
      };
      btns[id] = b; grid.appendChild(b);
    });
    body.appendChild(grid); body.appendChild(out);

    function refresh() {
      GOD_ORDER.forEach(function (id) { btns[id].setAttribute('aria-pressed', godSel.indexOf(id) >= 0); });
      out.innerHTML = '';
      if (godSel.length < 2) { out.appendChild(el('<div class="empty">신을 2개 이상 골라 주세요</div>')); return; }
      E.recommendGods(RUN.state, godSel).forEach(function (r, i) {
        out.appendChild(recCard(r, i, function () {
          RUN.pending_god = r.id; pickSel = []; godTab = r.id;
          UI.screen = 'boons'; saveUI(); saveRun(); render();
        }, '이 문으로'));
      });
    }
    refresh();
    return wrapSheet('신 선택', body);
  }

  // ── 4·5. 은혜 / 망치 선택 ──────────────────────────────
  var pickSel = [], godTab = null, searchOn = false, searchQ = '';
  function viewPick(kind) {
    var isBoon = kind === 'boon';
    if (isBoon && RUN.pending_god) { godTab = RUN.pending_god; RUN.pending_god = null; saveRun(); }
    if (isBoon && !godTab) godTab = UI.god_tab || RUN.state.gods_seen[RUN.state.gods_seen.length - 1] || 'zeus';
    var body = document.createElement('div');
    var listBox = el('<div class="list"></div>');
    var recBox = el('<div></div>');
    var trayBox = el('<div class="tray"></div>');

    if (isBoon) {
      var top = el('<div class="row" style="padding:8px 14px 0"><div class="sm dim" style="flex:1">게임에 뜬 은혜를 2~3개 탭</div><button class="iconbtn" data-s>🔍</button></div>');
      top.querySelector('[data-s]').onclick = function () { searchOn = !searchOn; if (!searchOn) searchQ = ''; draw(); };
      body.appendChild(top);
      var sbox = el('<div class="wrap" style="padding-bottom:8px"></div>');
      body.appendChild(sbox);
      var tabs = el('<div class="chips"></div>');
      GOD_ORDER.forEach(function (id) {
        var b = el('<button class="chip" aria-pressed="' + (godTab === id) + '" style="border-color:' + GC[id] + '">' + esc(nm(id)) + '</button>');
        b.onclick = function () { godTab = id; UI.god_tab = id; saveUI(); searchQ = ''; draw(); };
        tabs.appendChild(b);
      });
      body.appendChild(tabs);
      body._sbox = sbox;
    } else {
      body.appendChild(el('<div class="wrap sm dim" style="padding:10px 14px 4px">게임에 뜬 다이달로스 망치를 2~3개 탭</div>'));
    }
    body.appendChild(listBox);
    body.appendChild(recBox);

    function candidates() {
      if (!isBoon) return DATA.hammers.filter(function (h) { return h.weapon === RUN.state.weapon; });
      if (searchQ) {
        var q = searchQ.trim();
        return DATA.boons.filter(function (b) { return b.name_ko.indexOf(q) >= 0; })
          .concat(DATA.duos.filter(function (d) { return d.name_ko.indexOf(q) >= 0; })).slice(0, 40);
      }
      var bs = DATA.boons.filter(function (b) { return b.god === godTab; });
      var ord = function (b) { var i = SLOTS.indexOf(b.slot); return i >= 0 ? i : (b.slot === 'passive' ? 5 : b.slot === 'infusion' ? 6 : 7); };
      bs.sort(function (a, b) { return ord(a) - ord(b); });
      var ds = DATA.duos.filter(function (d) { return d.gods.indexOf(godTab) >= 0; });
      return bs.concat(ds);
    }

    function draw() {
      if (isBoon) {
        var sb = body._sbox; sb.innerHTML = '';
        if (searchOn) {
          var inp = el('<input type="search" placeholder="은혜 이름 검색" value="' + esc(searchQ) + '">');
          inp.oninput = function () { searchQ = inp.value; drawList(); };
          sb.appendChild(inp);
        }
      }
      drawList(); drawTray(); drawRec();
    }
    function drawList() {
      listBox.innerHTML = '';
      var owned = RUN.state.boons.concat(RUN.state.hammers);
      candidates().forEach(function (o) {
        var picked = pickSel.some(function (p) { return p.id === o.id; });
        var isOwned = owned.indexOf(o.id) >= 0;
        var sub = o.kind === 'duo' ? '융합 (' + o.gods.map(nm).join('·') + ')' : (o.effect || '');
        // 현재 양상에서 등장하지 않는 망치는 흐리게 + 사유 표시 (SPEC 3-5)
        var aspOnly = o.aspect_only && o.aspect_only !== RUN.state.aspect;
        var aspEx = (o.aspect_excluded || []).indexOf(RUN.state.aspect) >= 0;
        var extra = isOwned ? '<span class="tagx">보유</span>'
          : aspOnly ? '<span class="tagx">' + esc(nm(o.aspect_only)) + ' 전용</span>'
          : aspEx ? '<span class="tagx">이 양상 제외</span>' : '';
        var b = el('<button class="item ' + (isOwned || aspOnly || aspEx ? 'off' : '') + '" aria-pressed="' + picked + '">' + slotChip(o) +
          '<div class="mid"><div class="nm ell">' + esc(o.name_ko) + '</div><div class="ef ell">' + esc(sub) + '</div></div>' + extra + '</button>');
        b.onclick = function () {
          var i = pickSel.findIndex(function (p) { return p.id === o.id; });
          if (i >= 0) pickSel.splice(i, 1);
          else {
            if (pickSel.length >= 3) pickSel.shift();
            pickSel.push({ id: o.id, rarity: o.kind === 'duo' ? 'duo' : (o.slot === 'legendary' ? 'legendary' : 'common') });
          }
          draw();
        };
        listBox.appendChild(b);
      });
      if (!listBox.children.length) listBox.appendChild(el('<div class="empty">해당하는 항목이 없습니다</div>'));
    }
    function drawTray() {
      trayBox.innerHTML = '';
      var picks = el('<div class="picks"></div>');
      if (!pickSel.length) picks.appendChild(el('<span class="sm dim">아직 고른 게 없습니다</span>'));
      pickSel.forEach(function (p, i) {
        var fixed = p.rarity === 'duo' || p.rarity === 'legendary';
        var c = el('<span class="pick">' + esc(nm(p.id)) +
          (fixed ? '' : '<button class="rar">' + RAR_KO[p.rarity] + '</button>') + '<button class="x">✕</button></span>');
        if (!fixed) c.querySelector('.rar').onclick = function () { p.rarity = RAR[(RAR.indexOf(p.rarity) + 1) % 4]; draw(); };
        c.querySelector('.x').onclick = function () { pickSel.splice(i, 1); draw(); };
        picks.appendChild(c);
      });
      trayBox.appendChild(picks);
    }
    function drawRec() {
      recBox.innerHTML = '';
      if (pickSel.length < 2) { recBox.appendChild(el('<div class="empty">2개 이상 고르면 바로 추천이 나옵니다</div>')); return; }
      var rows = isBoon ? E.recommendBoons(RUN.state, pickSel) : E.recommendHammers(RUN.state, pickSel.map(function (p) { return p.id; }));
      rows.forEach(function (r, i) {
        recBox.appendChild(recCard(r, i, function () {
          pushHistory((isBoon ? '은혜' : '망치') + ' ' + nm(r.id));
          var rar = (pickSel.find(function (p) { return p.id === r.id; }) || {}).rarity;
          RUN.state = E.applyChoice(RUN.state, { kind: isBoon ? 'boon' : 'hammer', id: r.id, rarity: rar });
          pickSel = []; saveRun(); closeSheet();
        }, '이걸로 결정'));
      });
    }
    draw();
    var s = wrapSheet(isBoon ? '은혜 선택' : '망치 선택', body);
    s.appendChild(trayBox);
    return s;
  }

  function recCard(r, i, onDecide, label) {
    var no = !isFinite(r.score);
    var c = el('<div class="rec ' + (i === 0 && !no ? 'r1' : '') + ' ' + (no ? 'no' : '') + '">' +
      '<div class="hd"><span class="rk">' + (r.rank || i + 1) + '위</span>' +
      (PREFS.show_score && !no ? '<span class="sc">' + r.score + '</span>' : '') + '</div>' +
      '<div class="nm">' + slotChip(ent(r.id)) + '<span class="ell">' + esc(nm(r.id)) + '</span></div>' +
      '<div class="rs">' + esc(r.reason) + '</div>' +
      ((r.badges && r.badges.length) ? '<div class="bg">' + r.badges.map(badgeHtml).join('') + '</div>' : '') +
      ((r.warnings && r.warnings.length) ? '<div class="warns">' + r.warnings.map(function (w) { return '<div>⚠ ' + esc(w) + '</div>'; }).join('') + '</div>' : '') +
      (no ? '' : '<div class="act"><button>' + esc(label) + '</button></div>') + '</div>');
    if (!no) c.querySelector('.act button').onclick = onDecide;
    if (r.breakdown) {
      var t;
      var start = function () { t = setTimeout(function () { toast(nm(r.id) + ' → ' + JSON.stringify(r.breakdown)); }, 500); };
      var stop = function () { clearTimeout(t); };
      c.addEventListener('touchstart', start, { passive: true }); c.addEventListener('touchend', stop);
      c.addEventListener('mousedown', start); c.addEventListener('mouseup', stop); c.addEventListener('mouseleave', stop);
    }
    return c;
  }

  // ── 6. 관리 ────────────────────────────────────────────
  function viewManage() {
    var st = RUN.state, body = document.createElement('div');
    function seg(label, opts, cur, cb) {
      var r = el('<div class="mrow"><div class="lb">' + esc(label) + '</div></div>');
      var s = el('<div class="seg" style="flex:1.4"></div>');
      opts.forEach(function (o) {
        var b = el('<button aria-pressed="' + (cur === o[0]) + '">' + esc(o[1]) + '</button>');
        b.onclick = function () { cb(o[0]); };
        s.appendChild(b);
      });
      r.appendChild(s); return r;
    }
    body.appendChild(seg('체력', [['high', '●●●'], ['mid', '●●○'], ['low', '●○○']], st.hp_state, function (v) { st.hp_state = v; saveRun(); render(); }));
    body.appendChild(seg('지역', [[1, '1'], [2, '2'], [3, '3'], [4, '4']], st.region, function (v) { st.region = v; saveRun(); render(); }));

    var k = E.recommendKeepsake(st);
    if (k && k.id) {
      var kc = el('<div class="card"><div class="xs dim">다음 지역 기념품 추천</div><div class="row" style="margin-top:4px"><b style="flex:1">' + esc(k.name_ko) + '</b><button class="tagx" data-k>이걸로</button></div><div class="sm dim" style="margin-top:4px">' + esc(k.reason) + '</div></div>');
      kc.querySelector('[data-k]').onclick = function () { pushHistory('기념품 ' + k.name_ko); st.keepsake = k.id; saveRun(); render(); };
      body.appendChild(kc);
    }

    body.appendChild(el('<h2>비술</h2>'));
    var hx = el('<div class="chips"></div>');
    DATA.hexes.forEach(function (h) {
      var b = el('<button class="chip" aria-pressed="' + (st.hex === h.id) + '">' + esc(h.name_ko) + '</button>');
      b.onclick = function () { st.hex = st.hex === h.id ? null : h.id; saveRun(); render(); };
      hx.appendChild(b);
    });
    body.appendChild(hx);

    body.appendChild(el('<h2>방향 고정</h2>'));
    var dl = el('<div class="chips"></div>');
    E.directionScores(st).forEach(function (d) {
      var b = el('<button class="chip" aria-pressed="' + (st.direction_lock === d.id) + '">' + esc(d.name_ko) + '</button>');
      b.onclick = function () { st.direction_lock = st.direction_lock === d.id ? null : d.id; saveRun(); render(); };
      dl.appendChild(b);
    });
    body.appendChild(dl);

    body.appendChild(el('<h2>보유 목록</h2>'));
    var ol = el('<div class="list"></div>');
    st.boons.concat(st.hammers).forEach(function (id) {
      var r = el('<div class="item"><div class="mid"><div class="nm ell">' + esc(nm(id)) + '</div></div><button class="tagx">✕</button></div>');
      r.querySelector('button').onclick = function () {
        pushHistory('제거 ' + nm(id));
        st.boons = st.boons.filter(function (x) { return x !== id; });
        st.hammers = st.hammers.filter(function (x) { return x !== id; });
        saveRun(); render();
      };
      ol.appendChild(r);
    });
    if (!ol.children.length) ol.appendChild(el('<div class="empty">아직 없습니다</div>'));
    body.appendChild(ol);

    body.appendChild(el('<h2>기록</h2>'));
    var hl = el('<div class="list"></div>');
    RUN.history.forEach(function (h) { hl.appendChild(el('<div class="item"><div class="mid sm ell">' + esc(h.label) + '</div></div>')); });
    if (!hl.children.length) hl.appendChild(el('<div class="empty">아직 없습니다</div>'));
    body.appendChild(hl);

    body.appendChild(el('<h2>설정</h2>'));
    body.appendChild(seg('왼손 모드', [[false, '끔'], [true, '켬']], PREFS.left_hand, function (v) { PREFS.left_hand = v; savePrefs(); render(); }));
    body.appendChild(seg('점수 표시', [[true, '켬'], [false, '끔']], PREFS.show_score, function (v) { PREFS.show_score = v; savePrefs(); render(); }));
    body.appendChild(seg('이해도 상한', [[10, '10'], [15, '15'], [20, '20'], [30, '30']], PREFS.grasp_cap, function (v) { PREFS.grasp_cap = v; savePrefs(); render(); }));

    body.appendChild(el('<h2>런 내보내기 / 불러오기</h2>'));
    var ta = el('<div class="wrap"><textarea spellcheck="false">' + esc(JSON.stringify(RUN)) + '</textarea></div>');
    var imp = el('<div class="wrap"><button class="tagx" style="padding:10px 14px">붙여넣은 내용으로 불러오기</button></div>');
    imp.querySelector('button').onclick = function () {
      try { var o = JSON.parse(ta.querySelector('textarea').value); if (!o.state || !o.state.weapon) throw 0; RUN = o; saveRun(); toast('불러왔습니다'); render(); }
      catch (e) { toast('형식이 올바르지 않습니다'); }
    };
    body.appendChild(ta); body.appendChild(imp);

    var nb = el('<button class="danger">새 런 시작</button>');
    nb.onclick = function () { UI.screen = 'start'; saveUI(); render(); };
    body.appendChild(nb);
    // 재배포를 반복하므로 어느 빌드를 쓰는 중인지 알 수 있게 표시 (피드백용)
    body.appendChild(el('<div class="wrap xs dim" style="padding:14px 14px 24px; text-align:center">빌드 ' +
      esc(DATA.__build || '?') + ' · 은혜 ' + DATA.boons.length + ' · 융합 ' + DATA.duos.length + ' · 망치 ' + DATA.hammers.length + '</div>'));
    return wrapSheet('관리', body);
  }

  // ── 시작 ───────────────────────────────────────────────
  if (RUN && (!RUN.state || !RUN.state.weapon)) RUN = null;
  if (RUN && UI.screen === 'start') UI.screen = null;
  render();
})();

</script>
